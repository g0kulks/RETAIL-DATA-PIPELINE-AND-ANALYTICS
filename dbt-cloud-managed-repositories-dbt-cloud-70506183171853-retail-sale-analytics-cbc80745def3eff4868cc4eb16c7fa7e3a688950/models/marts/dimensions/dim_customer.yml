
version: 2

models:
  - name: dim_customer
    description: "Customer dimension table"

    columns:
      - name: customer_key
        description: "Unique surrogate key for each customer"
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Original customer identifier"
        data_tests:
          - unique
          - not_null