
version: 2

models:
  - name: mart_product_pareto
    description: >
      Product-level Pareto and ABC revenue classification mart.

      Analyses valid positive merchandise sales to identify
      products contributing the most revenue.

      Excludes cancellation invoices, non-positive quantities,
      non-positive unit prices, missing product codes, and
      specified non-merchandise transaction codes.

      Product codes are normalized using UPPER and TRIM.

      Products are ranked by revenue in descending order,
      with product code used as a deterministic tie-breaker.

      Revenue share and cumulative revenue contribution
      are calculated as percentages of total merchandise revenue.

      Products are classified into ABC categories:
      A for cumulative revenue up to 80 percent,
      B for cumulative revenue above 80 and up to 95 percent,
      and C for cumulative revenue above 95 percent.

      Grain is one row per normalized merchandise product code.

    columns:
      - name: PRODUCT_CODE
        description: >
          Normalized merchandise product identifier.
          Primary business key for this mart.
        data_tests:
          - not_null
          - unique

      - name: SALES_ROWS
        description: >
          Number of valid positive sales transaction rows
          associated with the product.
        data_tests:
          - not_null

      - name: UNITS_SOLD
        description: >
          Total quantity sold through valid positive
          merchandise sales transactions.
        data_tests:
          - not_null

      - name: PRODUCT_REVENUE
        description: >
          Total positive merchandise sales revenue
          generated by the product, rounded to
          two decimal places.
        data_tests:
          - not_null

      - name: REVENUE_RANK
        description: >
          Unique sequential product ranking based on
          descending revenue contribution.
          Product code breaks ties deterministically.
        data_tests:
          - not_null
          - unique

      - name: REVENUE_SHARE_PCT
        description: >
          Percentage of total merchandise revenue
          contributed by the individual product.
          Rounded to four decimal places.
        data_tests:
          - not_null

      - name: CUMULATIVE_REVENUE_PCT
        description: >
          Running cumulative percentage of merchandise
          revenue ordered by descending product revenue.
          Rounded to four decimal places.
        data_tests:
          - not_null

      - name: ABC_CATEGORY
        description: >
          Product classification based on cumulative
          revenue contribution.

          A represents cumulative revenue up to 80 percent.
          B represents cumulative revenue above 80
          and up to 95 percent.
          C represents cumulative revenue above 95 percent.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - A
                  - B
                  - C
